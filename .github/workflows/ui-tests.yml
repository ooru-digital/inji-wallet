name: UI tests (Maestro)

# Builds the release APK, boots an Android emulator and runs the Maestro flows in .maestro/.
# Every flow starts from a fresh install and sets the passcode itself, so nothing is shared
# between runs. The report, and screenshots and recordings of any failure, are attached to the run.
#
# Secrets: the Android build's (CREDISSUER_API_TOKEN, CREDISSUER_ANDROID_KEYSTORE_BASE64,
# CREDISSUER_ANDROID_KEYSTORE_ALIAS, CREDISSUER_ANDROID_KEYSTORE_PASSWORD, ARTIFACTORY_USERNAME,
# ARTIFACTORY_PASSWORD).

on:
  workflow_dispatch:
  pull_request:
    branches: [CredIssuer-revamp]
  schedule:
    # Nightly, 02:00 UTC
    - cron: '0 2 * * *'

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  MAESTRO_VERSION: '2.12.1'
  APK_PATH: android/app/build/outputs/apk/residentapp/release/CredIssuerWallet_universal.apk

jobs:
  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          npm ci

      - name: Write the files the build reads but git ignores
        env:
          CREDISSUER_API_TOKEN: ${{ secrets.CREDISSUER_API_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.CREDISSUER_ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf 'CREDISSUER_API_TOKEN=%s\n' "$CREDISSUER_API_TOKEN" > .env.local
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      # The emulator is x86_64, so only that CPU type's native code is built. Its keystore is
      # software-only, which the app refuses unless built with allowSoftwareKeystore.
      - name: Build the APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.CREDISSUER_ANDROID_KEYSTORE_ALIAS }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CREDISSUER_ANDROID_KEYSTORE_PASSWORD }}
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        run: ./gradlew -PallowSoftwareKeystore=true -PreactNativeArchitectures=x86_64 generateCodegenArtifactsFromSchema :app:assembleResidentappRelease

      - name: Remove secret files
        if: always()
        run: rm -f .env.local android/app/release.keystore

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | MAESTRO_VERSION="$MAESTRO_VERSION" bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r "$APK_PATH"
            mkdir -p maestro-output
            maestro test .maestro --format junit --output maestro-output/report.xml --debug-output maestro-output/debug --flatten-debug-output

      # A table of the flows on the run page. Each flow's screenshots and screen recording are in
      # the maestro-results download, in debug/<flow>/takeScreenshot and startRecording.
      - name: Summary
        if: always()
        shell: python
        run: |
          import os
          import xml.etree.ElementTree as ET

          lines = []
          if os.path.exists('maestro-output/report.xml'):
              cases = ET.parse('maestro-output/report.xml').getroot().iter('testcase')
              rows = []
              for case in cases:
                  failure = case.find('failure')
                  if failure is None:
                      result = '✅ passed'
                  else:
                      message = (failure.get('message') or failure.text or '').strip().splitlines()
                      result = '❌ ' + (message[0] if message else 'failed')
                  rows.append((case.get('name'), result, float(case.get('time', 0))))
              passed = sum(r[1].startswith('✅') for r in rows)
              lines.append(f'### UI tests: {passed} of {len(rows)} flows passed')
              lines.append('')
              lines.append('| Flow | Result | Time |')
              lines.append('|---|---|---|')
              lines += [f'| {name} | {result} | {secs:.0f} s |' for name, result, secs in rows]
              lines.append('')
              lines.append('Screenshots and a screen recording of each flow: the **maestro-results** download below.')
          else:
              lines.append('### UI tests did not run')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf8') as f:
              f.write('\n'.join(lines) + '\n')

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-results
          path: maestro-output
          if-no-files-found: ignore
          retention-days: 14
