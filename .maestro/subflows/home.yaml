# The wallet's Home screen, unlocked with 111111, from whatever state an earlier flow left.
appId: io.ooru.credissuerwallet
---
- runFlow:
    file: set-up-once.yaml
    env:
      CAMERA: ${CAMERA || 'allow'}
- runFlow:
    when:
      visible: "Your cards are locked."
    commands:
      - tapOn: "Unlock"
      - extendedWaitUntil:
          visible: "Enter your passcode"
          timeout: 30000
      - runFlow: type-passcode.yaml
# A tip or tour an earlier flow left open covers Home.
- repeat:
    while:
      visible: "Quick tip|Quick tour.*"
    times: 10
    commands:
      - tapOn: "Got It|Next|Done"
- extendedWaitUntil:
    visible: "No cards yet"
    timeout: 30000
