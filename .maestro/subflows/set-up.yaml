# A fresh install up to the tour (or Home): English, passcode 111111.
appId: io.ooru.credissuerwallet
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Choose your language"
    timeout: 30000
- takeScreenshot: 1-language
- tapOn: "English"
- tapOn: "Continue"
# Phones with biometrics are asked how to unlock first, with fingerprint preselected.
- extendedWaitUntil:
    visible: "Protect your wallet|Choose a 6-digit passcode"
    timeout: 30000
- runFlow:
    when:
      visible: "Protect your wallet"
    commands:
      - tapOn: "6-digit passcode"
      - tapOn: "Continue"
- extendedWaitUntil:
    visible: "Choose a 6-digit passcode"
    timeout: 30000
- takeScreenshot: 2-passcode
- runFlow: type-passcode.yaml
- extendedWaitUntil:
    visible: "Enter it once more"
    timeout: 30000
- runFlow: type-passcode.yaml
- extendedWaitUntil:
    visible: "Quick tip|Quick tour.*|No cards yet"
    timeout: 60000
