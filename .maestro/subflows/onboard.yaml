# A fresh install up to the empty Home screen, tour skipped.
appId: io.ooru.credissuerwallet
---
- runFlow: set-up.yaml
- runFlow:
    when:
      visible: "Skip tour"
    commands:
      - tapOn: "Skip tour"
- runFlow:
    when:
      visible: "Some security features will be unavailable"
    commands:
      - tapOn: "Ok"
- extendedWaitUntil:
    visible: "No cards yet"
    timeout: 30000
