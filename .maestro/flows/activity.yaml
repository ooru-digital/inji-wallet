appId: io.ooru.credissuerwallet
name: Activity
---
- startRecording: recording
- runFlow: ../subflows/home.yaml
- tapOn: "Activity"
- extendedWaitUntil:
    visible: "Notifications"
    timeout: 15000
- assertVisible: "Credentials"
- assertVisible: "Sharing"
- takeScreenshot: 1-activity
- stopRecording
