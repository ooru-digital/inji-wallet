appId: io.ooru.credissuerwallet
name: Settings
---
- startRecording: recording
- runFlow: ../subflows/home.yaml
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Security and Privacy"
    timeout: 15000
- assertVisible: "Change PIN"
- assertVisible: "Auto-lock"
- takeScreenshot: 1-settings
- scrollUntilVisible:
    element: "About CredIssuer Wallet"
    direction: DOWN
- takeScreenshot: 2-settings-bottom
- stopRecording
