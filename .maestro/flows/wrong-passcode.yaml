appId: io.ooru.credissuerwallet
name: A wrong passcode is refused
---
- runFlow: ../subflows/onboard.yaml
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Your cards are locked."
    timeout: 30000
- tapOn: "Unlock"
- extendedWaitUntil:
    visible: "Enter your passcode"
    timeout: 30000
- repeat:
    times: 6
    commands:
      - inputText: "2"
- extendedWaitUntil:
    visible: "Passcode did not match."
    timeout: 30000
- assertNotVisible: "No cards yet"
