appId: io.ooru.credissuerwallet
name: Unlock with the passcode
---
- runFlow: ../subflows/onboard.yaml
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Your cards are locked."
    timeout: 30000
- tapOn: "Unlock"
- extendedWaitUntil:
    visible: "Enter your passcode"
    timeout: 30000
- runFlow: ../subflows/type-passcode.yaml
- extendedWaitUntil:
    visible: "No cards yet"
    timeout: 30000
