appId: io.ooru.credissuerwallet
name: Unlock with the passcode
---
- startRecording: recording
- runFlow: ../subflows/set-up-once.yaml
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Your cards are locked."
    timeout: 30000
- takeScreenshot: 1-locked
- tapOn: "Unlock"
- extendedWaitUntil:
    visible: "Enter your passcode"
    timeout: 30000
- runFlow: ../subflows/type-passcode.yaml
- extendedWaitUntil:
    visible: "No cards yet"
    timeout: 30000
- takeScreenshot: 2-unlocked
- stopRecording
