appId: io.ooru.credissuerwallet
name: Tour guide from Settings
---
- startRecording: recording
- runFlow: ../subflows/open-settings.yaml
- scrollUntilVisible:
    element: "CredIssuer Tour Guide"
    direction: DOWN
- tapOn: "CredIssuer Tour Guide"
# It opens on Home with the tip on "Add a card" first, then the numbered steps.
- extendedWaitUntil:
    visible: "Quick tip"
    timeout: 15000
- takeScreenshot: 1-tour-1
- tapOn: "Got It"
- evalScript: ${output.tourStep = 1}
- repeat:
    while:
      visible: "Quick tour.*"
    times: 10
    commands:
      - evalScript: ${output.tourStep = output.tourStep + 1}
      - extendedWaitUntil:
          visible: "Quick tour · ${output.tourStep} of .*"
          timeout: 10000
      - takeScreenshot: 1-tour-${output.tourStep}
      - tapOn: "Next|Done"
- assertTrue:
    condition: ${output.tourStep > 1}
    label: The numbered tour steps were shown
- extendedWaitUntil:
    visible: "No cards yet"
    timeout: 15000
- assertNotVisible: "Quick tip|Quick tour.*"
- stopRecording
