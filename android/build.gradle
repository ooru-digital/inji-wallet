// AGP 8.4 defaults javac's target to 17 (matching the JDK running Gradle),
// but Kotlin still defaults jvmTarget to 1.8, which breaks any subproject
// (including third-party native modules) that has both Java and Kotlin
// sources. Pin both consistently across every subproject.
subprojects { subproject ->
    afterEvaluate {
        if (subproject.hasProperty('android')) {
            subproject.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
}
