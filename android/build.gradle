// Top-level build file where you can add configuration options common to all sub-projects/modules.

// SnapKYC face-liveness AARs live on a private Artifactory. Credentials come from an untracked
// android/artifactory.local.properties, falling back to ARTIFACTORY_USERNAME/PASSWORD for CI.
def artifactoryProps = new Properties()
def artifactoryFile = rootProject.file("artifactory.local.properties")
if (artifactoryFile.exists()) artifactoryProps.load(new FileInputStream(artifactoryFile))
artifactoryProps.each { key, value -> rootProject.ext.set(key, value) }

def snapKycArtifactoryUsername = {
    artifactoryProps.getProperty("artifactoryUsername")
        ?: System.getenv("ARTIFACTORY_USERNAME")
        ?: ""
}
def snapKycArtifactoryPassword = {
    artifactoryProps.getProperty("artifactoryPassword")
        ?: System.getenv("ARTIFACTORY_PASSWORD")
        ?: ""
}
def biochqUseLocalMaven =
    (artifactoryProps.getProperty("biochqUseLocalMaven") ?: "false").toBoolean()
// Defaults point at the public Nexus, which needs no VPN. The old internal host
// (http://biometrics.credissuer.com:8081) resolved to an RFC1918 address and so
// only built from inside the corporate network; it still works if set explicitly.
def artifactorySnapshotUrl =
    artifactoryProps.getProperty("artifactorySnapshotUrl")
        ?: "https://nexus-biochq.credissuer.com/repository/maven-snapshots/"
def artifactoryReleaseUrl =
    artifactoryProps.getProperty("artifactoryReleaseUrl")
        ?: "https://nexus-biochq.credissuer.com/repository/maven-releases/"
def biochqLocalMavenPath =
    artifactoryProps.getProperty("biochqLocalMavenPath")
        ?: "${rootProject.projectDir}/local-maven"

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 26
        compileSdkVersion = 35
        targetSdkVersion = 35
        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "21.4.7075529"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        jcenter()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.4.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:3.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}


