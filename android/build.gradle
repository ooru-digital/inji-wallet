// React Native's Gradle plugin hardcodes `https://www.jitpack.io` and injects it into every
// subproject (see @react-native/gradle-plugin DependencyUtils.kt:49 `mavenRepoFromUrl(...)`).
// That host currently accepts the TCP connection and completes the TLS handshake but never
// answers, so any artifact that has to come from JitPack — e.g.
// com.github.multiformats:java-multibase, pulled in transitively — fails the build with
// "Read timed out". The canonical host without the `www.` prefix serves the same artifacts
// immediately.
//
// `repositories.all` is a live hook, so this also rewrites repositories added later by the
// React Native plugin, and it survives `npm install` (unlike patching node_modules).
// Remove once React Native ships a fixed URL upstream, or JitPack restores the `www.` host.
allprojects {
    repositories.all { repo ->
        if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository
                && repo.url.toString().startsWith("https://www.jitpack.io")) {
            repo.url = uri("https://jitpack.io")
        }
    }
}
