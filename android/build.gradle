// Top-level build file where you can add configuration options common to all sub-projects/modules.

// The BioChq face SDK (io.ooru.biometrics) lives on the BioChq Nexus. Credentials, first found
// wins: an untracked android/artifactory.local.properties, ARTIFACTORY_USERNAME/PASSWORD (CI),
// then the Nexus line of ~/.netrc, the same file Xcode uses for the iOS SDK. Never in the repo.
def artifactoryProps = new Properties()
def artifactoryFile = rootProject.file("artifactory.local.properties")
if (artifactoryFile.exists()) artifactoryProps.load(new FileInputStream(artifactoryFile))
artifactoryProps.each { key, value -> rootProject.ext.set(key, value) }

def biochqNexusHost = "nexus-biochq.credissuer.com"
// login and password of `machine <biochqNexusHost>` in ~/.netrc, or an empty map.
def netrcCredentials = {
    def netrc = new File(System.getProperty("user.home"), ".netrc")
    if (!netrc.canRead()) return [:]
    def tokens = netrc.text.split(/\s+/).findAll { it }
    def found = [:]
    def inHost = false
    for (int i = 0; i < tokens.size() - 1; i++) {
        def token = tokens[i]
        if (token == "machine") {
            inHost = tokens[i + 1] == biochqNexusHost
        } else if (token == "default") {
            inHost = false
        } else if (inHost && (token == "login" || token == "password")) {
            found[token] = tokens[i + 1]
        }
    }
    return found
}.memoize()

def snapKycArtifactoryUsername = {
    artifactoryProps.getProperty("artifactoryUsername")
        ?: System.getenv("ARTIFACTORY_USERNAME")
        ?: netrcCredentials().login
        ?: ""
}
def snapKycArtifactoryPassword = {
    artifactoryProps.getProperty("artifactoryPassword")
        ?: System.getenv("ARTIFACTORY_PASSWORD")
        ?: netrcCredentials().password
        ?: ""
}
def biochqUseLocalMaven =
    (artifactoryProps.getProperty("biochqUseLocalMaven") ?: "false").toBoolean()
// The SDK's release repositories, as in its integration guide: buildpiper-release holds releases
// and release candidates (never changed once published), buildpiper-snapshot the dev builds.
def artifactorySnapshotUrl =
    artifactoryProps.getProperty("artifactorySnapshotUrl")
        ?: "https://${biochqNexusHost}/repository/buildpiper-snapshot/"
def artifactoryReleaseUrl =
    artifactoryProps.getProperty("artifactoryReleaseUrl")
        ?: "https://${biochqNexusHost}/repository/buildpiper-release/"
def biochqLocalMavenPath =
    artifactoryProps.getProperty("biochqLocalMavenPath")
        ?: "${rootProject.projectDir}/local-maven"

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "29.0.14206865"
        // Kotlin 2.x is required by Expo 53: expo-modules-core applies
        // `org.jetbrains.kotlin.plugin.compose`, which only exists for Kotlin 2.0+.
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        jcenter()
        mavenCentral()
    }
    dependencies {
        // compileSdk 36 requires AGP 8.9+; React Native 0.79 also needs 8.7 or newer.
        classpath("com.android.tools.build:gradle:8.9.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:3.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}


